name: lpc-negative-limit
description: >
  Writes a negative consumption limit, which LPC does not allow (LPC-003), and requires the
  device to reject it: the limit read back afterwards must not be the negative value. Test
  cases ATC_COM_PT_CSConnection_003 and CSTransition1_001 additionally expect the device to
  switch to unlimited/controlled on such a write. Ends by releasing the limit.
covers: "LPC scenario 1: a negative consumption limit."
goal: "Proves the device rejects an invalid limit instead of applying it."
hint: "Changes the device's limit state while it runs."
category: LPC
risk: live-control
requires:
  capabilities: [lpc.write]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: -1000, is_active: true}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      not_equals: {value_w: -1000}
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: 0, is_active: false}
