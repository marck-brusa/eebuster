name: opev-guard-subscription
description: >
  Checks that the vehicle subscribed to the Energy Guard's DeviceDiagnosis feature, the
  server feature that carries the guard's heartbeat (scenario 2) and operating state
  (scenario 3). The pre-scenario communication of both scenarios requires a subscription to
  every relevant server feature (EEBus UC TS OPEV V1.0.1b, sections 3.4.2.1 and 3.4.3.1): a
  vehicle without it can never notice that the guard went away [OPEV-005] or failed
  [OPEV-007]. Needs a vehicle associated: the subscription comes from the EV entity.
covers: "OPEV scenarios 2 and 3: the vehicle subscribed to our heartbeat and operating state."
goal: "Proves the vehicle can notice an absent or failed Energy Guard at all."
hint: "Needs a vehicle."
category: OPEV
risk: read-only
spec: {use_case: OPEV, scenario: 2, section: "3.4.2.1, 3.4.3.1", requirements: [OPEV-005, OPEV-007], verification: wire}
requires:
  vehicle: true
  use_cases: [overloadProtectionByEvChargingCurrentCurtailment]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/peers/{peer.ski}/subscriptions"
      contains: {server_feature_subscribers.DeviceDiagnosis: EV}
