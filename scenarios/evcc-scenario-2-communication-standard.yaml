name: evcc-scenario-2-communication-standard
description: >
  Reads the vehicle's communication standard from the energy snapshot. The use case allows
  exactly one of iso15118-2ed1, iso15118-2ed2 and iec61851.
covers: "EVCC scenario 2: the vehicle's communication standard, one of the three the use case allows."
goal: "Proves the station reports how the vehicle communicates."
hint: "Needs a vehicle."
category: EVCC
risk: read-only
spec: {use_case: EVCC, scenario: 2, table: Table 7, requirements: [EVCC-002, EVCC-003, EVCC-004, EVCC-005], verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [evCommissioningAndConfiguration]
  scenarios: [2]
  vehicle: true
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ev.vehicles.0.communication_standard]
      one_of: {ev.vehicles.0.communication_standard: [iso15118-2ed1, iso15118-2ed2, iec61851]}
