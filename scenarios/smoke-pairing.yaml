name: smoke-pairing
description: Confirms that at least one configured peer completed SHIP pairing and SPINE setup.
covers: "SHIP pairing and SPINE setup with the configured device."
goal: "Proves the basics work before anything else is tested."
hint: "If this fails, fix pairing first: both sides must trust each other."
category: Connectivity
risk: read-only
requires:
  capabilities: [device_profile]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - log: "peer connected -- see GET /api/v1/peers for entities and device address"
