name: conformance-window
description: >
  Exercises discovery and measurement reads against the device, and
  then requires the frames of this test case to be free of conformance errors. Catches structurally
  broken EEBUS JSON — objects carrying several elements, empty objects, empty array instances
  such as "permittedValueSet":[[]] (SHIP TS 1.0.1 §11.4/§11.5) — and SPINE datagram
  violations (SPINE TS ProtocolSpecification 1.3.0 §5) exactly as they appeared on the wire,
  before any stack-side repair. Advisory warnings do not fail the window; errors do.
covers: "Wire format of everything sent during discovery and reads (SHIP TS §11, SPINE TS §5)."
goal: "Proves the device sends valid EEBUS JSON that strict controllers accept."
hint: "Open Message trace to see a frame it names."
category: Conformance
risk: read-only
spec: {document: "SHIP TS 1.0.1 §11.4, §11.5; SPINE TS ProtocolSpecification 1.3.0 §5", verification: wire}
requires:
  capabilities: [energy_snapshot]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/peers/{peer.ski}/profile"
      not_null: [ski]
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ts]
  - sleep: 3
  - conformance: {max_errors: 0}
