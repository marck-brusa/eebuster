name: conformance-window
description: >
  Clears the wire trace, exercises discovery and measurement reads against the device, and
  then requires the captured window to be free of conformance errors. Catches structurally
  broken EEBUS JSON — objects carrying several elements, empty objects, empty array instances
  such as "permittedValueSet":[[]] (SHIP TS 1.0.1 §11.4/§11.5) — and SPINE datagram
  violations (SPINE TS ProtocolSpecification 1.3.0 §5) exactly as they appeared on the wire,
  before any stack-side repair. Advisory warnings do not fail the window; errors do.
category: Conformance
risk: read-only
requires:
  capabilities: [energy_snapshot]
peer: device-under-test
steps:
  - delete: {path: "/api/v1/trace"}
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/peers/{peer.ski}/profile"
      not_null: [ski]
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ts]
  - sleep: 3
  - assert:
      get: "/api/v1/trace/summary"
      greater_than: {frames: 0}
      equals: {errors: 0}
