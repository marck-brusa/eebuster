name: lpc-heartbeat-60s-interval
description: >
  Sends the testbench's heartbeat every 60 s with a timeout of 60 s, the interval of a VDE FNN
  control box, instead of every 2 s. A Controllable System enters its failsafe state only
  after 120 s without a heartbeat, so with a heartbeat every 60 s it must never get there.
  The device is brought into "unlimited/controlled" first; 165 s after the change of interval
  -- 45 s after the last heartbeat -- two different failsafe limits are written, with no
  limit write before them. Outside the failsafe state a device evaluates such writes; in it, it
  evaluates them only after a heartbeat and a limit write (LPC-TS-037). Both must therefore be
  read back. A device that expects heartbeats closer together than 45 s sits in its failsafe
  state by then and ignores them. The heartbeat returns to every 2 s at the end; vehicles
  checking the heartbeat over OPEV fall back to a safe current while it runs every 60 s.
covers: "LPC scenario 3: a heartbeat every 60 s keeps the device out of its failsafe state."
goal: "Proves the device works with the heartbeat interval of a grid operator's control box, not only with a fast one."
hint: "Takes about three minutes; restores the heartbeat interval and the failsafe values."
category: LPC
risk: disruptive
long_running: true
spec: {use_case: LPC, scenario: 3, requirements: [LPC-TS-028, LPC-TS-037], verification: readback, guidelines: {vde-fnn-steuerbox: [EEBUS_013, STB_0415]}}
requires:
  parameters: [failsafe_w]
  capabilities: [heartbeat, heartbeat.cadence, lpc.write, lpc.failsafe]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - capture:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      values: {original_w: value_w, original_duration: duration}
      optional: true
  # Precondition: heartbeat received and a deactivated limit accepted ("unlimited/controlled").
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      template: lpc.limit.release
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      equals: {is_active: false}
  # The first heartbeat at the new interval goes out at once, then at 60 s and 120 s.
  - put:
      path: "/api/v1/heartbeat"
      body: {timeout_s: 60, interval_s: 60}
  - sleep: 165
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe"
      body: {value_w: "{params.failsafe_w.0}"}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      equals: {value_w: "{params.failsafe_w.0}"}
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe"
      body: {value_w: "{params.failsafe_w.1}"}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      equals: {value_w: "{params.failsafe_w.1}"}
finally:
  - put:
      path: "/api/v1/heartbeat"
      body: {timeout_s: 4}
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  # A device that did enter its failsafe state leaves it on a heartbeat and a limit write.
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      template: lpc.limit.release
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe?unchecked=true"
      body: {value_w: "{captured.original_w}", duration: "{captured.original_duration}"}
