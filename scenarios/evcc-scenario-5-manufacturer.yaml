name: evcc-scenario-5-manufacturer
description: >
  Reads EVCC scenario 5 data of the connected vehicle from the energy snapshot.
covers: "EVCC scenario 5: the vehicle's manufacturer information."
goal: "Proves the station reports who built the vehicle."
hint: "Needs a vehicle."
category: EVCC
risk: read-only
spec: {use_case: EVCC, scenario: 5, verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [evCommissioningAndConfiguration]
  scenarios: [5]
  vehicle: true
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      any_not_null: [ev.vehicles.0.manufacturer.brand_name, ev.vehicles.0.manufacturer.device_name, ev.vehicles.0.manufacturer.serial_number]
