name: mgcp-scenario-4-consumed-energy
description: >
  Reads the total energy consumed from the grid twice, 10 s apart. It must be present, not
  negative (consumption is positive under the use case's sign convention) and must not
  decrease. Scenarios 2 to 4 are mandatory for the grid connection point; the others are
  tested when advertised.
covers: "MGCP scenario 4: the total consumed energy, positive and never decreasing."
goal: "Proves the grid connection point reports this value."
category: MGCP
risk: read-only
spec: {use_case: MGCP, scenario: 4, test_case: ATC_SCE4_PT_GCPTotalConsumedEnergy_001, requirements: [MGCP-TS-004, MGCP-TS-010], verification: readback}
requires:
  use_cases: [monitoringOfGridConnectionPoint]
  scenarios: [4]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/mgcp/{peer.ski}"
      not_null: [energy_consumed_wh]
      greater_or_equal: {energy_consumed_wh: 0}
  - capture:
      get: "/api/v1/mgcp/{peer.ski}"
      values: {consumed: energy_consumed_wh}
  - sleep: 10
  - assert:
      get: "/api/v1/mgcp/{peer.ski}"
      not_null: [energy_consumed_wh]
      greater_or_equal: {energy_consumed_wh: "{captured.consumed}"}
