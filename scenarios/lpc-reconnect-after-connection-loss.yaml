name: lpc-reconnect-after-connection-loss
description: >
  Takes the connection down for 125 s by stopping the testbench's stack, as when a control
  box restarts after a power cut or loses its network. A Controllable System in the state
  "limited" enters its failsafe state after 120 s without a heartbeat. When the stack is back
  the connection must be set up again, the device must subscribe to the heartbeat again, and
  it must take the device out of failsafe the way a control box does after every connection
  setup: a heartbeat, a consumption limit, then the failsafe values (ATC_COM_PT_CSTransition9_001).
  The limit and the failsafe values must be read back. The run's connection and device heartbeat
  checks leave this test case's time out.
covers: "LPC scenario 3: after 125 s without a connection, the device reconnects and accepts a limit and failsafe values."
goal: "Proves the device recovers from a lost connection to its energy guard without a manual step."
hint: "Takes about three minutes; the device's connection is down for 125 s. Restores the failsafe values and releases the limit."
category: LPC
risk: disruptive
long_running: true
interrupts_connection: true
spec: {use_case: LPC, scenario: 3, test_case: ATC_COM_PT_CSTransition9_001, requirements: [LPC-TS-029, LPC-TS-032, LPC-TS-037], verification: readback, guidelines: {vde-fnn-steuerbox: [EEBUS_008, EEBUS_023, EEBUS_037, STB_0425]}}
requires:
  parameters: [limits_w, failsafe_w]
  capabilities: [heartbeat, lpc.write, lpc.failsafe, peer.subscriptions]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - capture:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      values: {original_w: value_w, original_duration: duration}
      optional: true
  # Precondition: the state "limited".
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: "{params.limits_w.1}", is_active: true, is_changeable: true}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      equals: {value_w: "{params.limits_w.1}", is_active: true}
  - post: {path: "/api/v1/stacks/eebus-go-remote/stop"}
  - sleep: 125
  - post: {path: "/api/v1/stacks/eebus-go-remote/start"}
  - wait_connected: {timeout: 120s}
  # LPC 3.3.4: a client subscribes to the features it reads, our heartbeat among them.
  - wait_for:
      get: "/api/v1/peers/{peer.ski}/subscriptions"
      timeout: 60s
      length_greater_than: {server_feature_subscribers.DeviceDiagnosis: 0}
  - sleep: 3
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: "{params.limits_w.2}", is_active: true, is_changeable: true}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      equals: {value_w: "{params.limits_w.2}", is_active: true}
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe"
      body: {value_w: "{params.failsafe_w.0}", duration: "PT2H"}
  - sleep: 2
  - assert:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      equals: {value_w: "{params.failsafe_w.0}", duration: "PT2H"}
finally:
  - post: {path: "/api/v1/stacks/eebus-go-remote/start"}
  - wait_connected: {timeout: 120s}
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      template: lpc.limit.release
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe?unchecked=true"
      body: {value_w: "{captured.original_w}", duration: "{captured.original_duration}"}
