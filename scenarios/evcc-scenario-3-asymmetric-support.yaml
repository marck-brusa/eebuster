name: evcc-scenario-3-asymmetric-support
description: >
  Reads EVCC scenario 3 data of the connected vehicle from the energy snapshot.
covers: "EVCC scenario 3: whether the vehicle supports asymmetric charging."
goal: "Proves the station reports asymmetric charging support."
hint: "Needs a vehicle."
category: EVCC
risk: read-only
spec: {use_case: EVCC, scenario: 3, verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [evCommissioningAndConfiguration]
  scenarios: [3]
  vehicle: true
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ev.vehicles.0.asymmetric_charging]
