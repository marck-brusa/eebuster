name: evcem-scenario-3-energy
description: >
  Reads the energy charged into the vehicle in this session twice, 10 s apart. It must be
  present, not negative and must not decrease while charging. An announced-but-empty scenario
  breaks the HEMS's session energy accounting silently. Skipped when the vehicle does not
  advertise the optional scenario 3.
covers: "EVCEM scenario 3: the energy charged in the session, never decreasing."
goal: "Proves an announced energy value is actually delivered, so a HEMS can account the session."
hint: "Needs a charging session."
category: EVCEM
risk: read-only
spec: {use_case: EVCEM, scenario: 3, table: Table 8, requirements: [EVCEM-005], verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [measurementOfElectricityDuringEvCharging]
  scenarios: [3]
  charging: true
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ev.vehicles.0.energy_charged_wh]
      greater_or_equal: {ev.vehicles.0.energy_charged_wh: 0}
  - capture:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      values: {charged: ev.vehicles.0.energy_charged_wh}
  - sleep: 10
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ev.vehicles.0.energy_charged_wh]
      greater_or_equal: {ev.vehicles.0.energy_charged_wh: "{captured.charged}"}
