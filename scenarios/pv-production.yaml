name: pv-production
description: Reads current photovoltaic production and adds it to dashboard history.
covers: "PV: current photovoltaic production."
goal: "Proves an inverter reports what it produces."
hint: "Skipped unless the device is a PV inverter."
category: Generation
risk: read-only
requires:
  capabilities: [energy_snapshot]
  use_cases: [visualizationOfAggregatedPhotovoltaicData]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [power.pv_w, pv]
