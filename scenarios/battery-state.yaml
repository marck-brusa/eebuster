name: battery-state
description: Reads aggregate battery power and state data.
covers: "Battery use case: aggregated battery power and state data."
goal: "Proves a battery reports its state, so a HEMS can plan with it."
hint: "Skipped unless the device advertises the battery use case."
category: Storage
risk: read-only
requires:
  capabilities: [energy_snapshot]
  use_cases: [visualizationOfAggregatedBatteryData]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [power.battery_w, battery]
