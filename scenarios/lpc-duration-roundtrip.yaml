name: lpc-duration-roundtrip
description: >
  A limit written with a duration must come back with one on an immediate read (SPINE
  loadControlLimitData timePeriod; EEBus UC TS Limitation of Power Consumption V1.0.0,
  scenario 1). A device that applies the duration internally but reports the limit without it
  leaves the controller unable to tell a temporary curtailment from a permanent one. The
  limit is released again at the end.
covers: "LPC scenario 1: a limit with a duration."
goal: "Proves a controller can tell a temporary limit from a permanent one."
hint: "Changes the device's power while it runs."
category: LPC
risk: live-control
spec: {use_case: LPC, scenario: 1, test_case: ATC_COM_PT_CSTransition6_001, requirements: [LPC-TS-001/1], verification: readback}
requires:
  capabilities: [lpc.write, lpc.read]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  # The device evaluates writes only once the energy guard's heartbeat arrives.
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: 3000, is_active: true, is_changeable: true, duration: "PT5M"}
  # Wait for the device to publish the new limit before reading it back. A write is
  # asynchronous -- acceptance, approval and the notify that follows all take time -- so an
  # immediate read can still return the previous limit and blame the device for it.
  - expect_event: {event: eg-lpc-DataUpdateLimit, within: 5s}
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      equals: {value_w: 3000, is_active: true}
      not_null: [duration]
finally:
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: 3000, is_active: false, is_changeable: true, delete_duration: true}
