name: vapd-scenario-1-peak-power
description: >
  Reads pv.0.nominal_peak_w from the energy snapshot.
covers: "VAPD scenario 1: the nominal peak power of the PV system."
goal: "Proves the device reports this value."
category: VAPD
risk: read-only
spec: {use_case: VAPD, scenario: 1, verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [visualizationOfAggregatedPhotovoltaicData]
  scenarios: [1]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [pv.0.nominal_peak_w]
      greater_than: {pv.0.nominal_peak_w: 0}
