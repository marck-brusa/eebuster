name: evcc-scenario-7-sleep-mode
description: >
  Reads EVCC scenario 7 data of the connected vehicle from the energy snapshot.
covers: "EVCC scenario 7: the vehicle's sleep mode state."
goal: "Proves the station reports whether the vehicle sleeps."
hint: "Needs a vehicle."
category: EVCC
risk: read-only
spec: {use_case: EVCC, scenario: 7, verification: readback}
requires:
  capabilities: [energy_snapshot]
  use_cases: [evCommissioningAndConfiguration]
  scenarios: [7]
  vehicle: true
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/energy/{peer.ski}/snapshot"
      not_null: [ev.vehicles.0.in_sleep_mode]
