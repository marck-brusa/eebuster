name: lpp-read-current
description: Reads the active production-limit state without changing it.
covers: "LPP: the active production limit, read only."
goal: "Shows the production limit state without changing anything."
hint: "Skipped on a pure consumer."
category: LPP
risk: read-only
spec: {use_case: LPP, scenario: 1, verification: readback}
requires:
  capabilities: [lpp.read]
  use_cases: [limitationOfPowerProduction]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/lpp/{peer.ski}/limit"
      not_null: [value_w, is_active, is_changeable]
