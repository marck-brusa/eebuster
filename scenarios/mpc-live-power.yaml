name: mpc-live-power
description: Reads total power and proves that the peer exposes a numeric measurement.
covers: "MPC: total power."
goal: "Proves the device reports a real number for its consumption."
category: MPC
risk: read-only
spec: {use_case: MPC, scenario: 1, test_case: ATC_SCE1_PT_MUTotalActivePower_001, requirements: [MPC-TS-001], verification: readback}
requires:
  capabilities: [mpc.read]
  use_cases: [monitoringOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/mpc/{peer.ski}"
      not_null: [power_w]
