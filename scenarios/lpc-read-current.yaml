name: lpc-read-current
description: Reads the active consumption-limit state without changing it.
covers: "LPC: the active consumption limit, read only."
goal: "Shows the limit state without changing anything."
category: LPC
risk: read-only
spec: {use_case: LPC, scenario: 1, verification: readback}
requires:
  capabilities: [lpc.read]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      not_null: [value_w, is_active, is_changeable]
