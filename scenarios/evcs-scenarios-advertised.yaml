name: evcs-scenarios-advertised
description: >
  Compares the scenarios the device advertises for evChargingSummary with the scenario
  implementation table of the use case specification. A scenario the table marks mandatory for
  the device's actor and that is not advertised fails the test case.
covers: "EVCS: the advertised scenarios against the specification's mandatory scenarios."
goal: "Proves the device announces every scenario of EVCS it must implement."
category: EVCS
risk: read-only
spec: {use_case: EVCS, verification: wire}
requires:
  use_cases: [evChargingSummary]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - scenarios_advertised: {use_case: EVCS}
