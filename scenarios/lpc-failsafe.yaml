name: lpc-failsafe
description: Writes and reads the failsafe power and its minimum duration.
covers: "LPC failsafe: the failsafe power and duration, written and read back."
goal: "Proves the device stores the fallback it must use when contact is lost."
hint: "Writes the failsafe values and restores the ones the device had at the end."
category: LPC
risk: live-control
spec: {use_case: LPC, scenario: 2, test_case: ATC_COM_PT_CSConnection_008, requirements: [LPC-TS-011/1, LPC-TS-013/1, LPC-TS-038], verification: readback}
requires:
  capabilities: [lpc.failsafe]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  # The device evaluates writes only once the energy guard's heartbeat arrives.
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  # Remembered so the device ends with the failsafe values it had, not the test's.
  - capture:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      values: {original_w: value_w, original_duration: duration}
      optional: true
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe"
      template: lpc.failsafe.typical
  - expect_event: {event: eg-lpc-DataUpdateFailsafeConsumptionActivePowerLimit, within: 5s}
  - assert:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      equals: {value_w: 2000, duration: "PT2H"}
finally:
  # Unchecked: the value is restored as the device had it, even outside the 2 h to 24 h window.
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe?unchecked=true"
      body: {value_w: "{captured.original_w}", duration: "{captured.original_duration}"}
