name: lpc-failsafe
description: Writes and reads the failsafe power and its minimum duration.
covers: "LPC failsafe: the failsafe power and duration, written and read back."
goal: "Proves the device stores the fallback it must use when contact is lost."
hint: "Changes the device's stored failsafe values."
category: LPC
risk: live-control
requires:
  capabilities: [lpc.failsafe]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - put:
      path: "/api/v1/lpc/{peer.ski}/failsafe"
      template: lpc.failsafe.typical
  - expect_event: {event: eg-lpc-DataUpdateFailsafeConsumptionActivePowerLimit, within: 5s}
  - assert:
      get: "/api/v1/lpc/{peer.ski}/failsafe"
      equals: {value_w: 2000, duration: "PT2H"}
