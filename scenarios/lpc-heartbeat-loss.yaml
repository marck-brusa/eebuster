name: lpc-heartbeat-loss
description: Starts and then stops the Energy Guard heartbeat for failsafe testing.
category: LPC
risk: disruptive
requires:
  capabilities: [heartbeat]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - call:
      method: eg-lpc/StartHeartbeat
      args: []
  - sleep: 2
  - call:
      method: eg-lpc/StopHeartbeat
      args: []
  - log: "heartbeat stopped -- watch the device's applied limit fall back to its failsafe value"
