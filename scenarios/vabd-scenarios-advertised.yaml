name: vabd-scenarios-advertised
description: >
  Compares the scenarios the device advertises for visualizationOfAggregatedBatteryData with
  the scenario implementation table of the use case specification. A scenario the table marks
  mandatory for the device's actor and that is not advertised fails the test case; recommended
  and optional scenarios that are not advertised are listed in the detail.
covers: "VABD: the advertised scenarios against the specification's mandatory scenarios."
goal: "Proves the device announces every scenario of VABD it must implement."
category: VABD
risk: read-only
spec: {use_case: VABD, verification: wire}
requires:
  use_cases: [visualizationOfAggregatedBatteryData]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - scenarios_advertised: {use_case: VABD}
