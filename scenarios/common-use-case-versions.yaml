name: common-use-case-versions
description: >
  Every use case the device advertises must state its actor and version in use-case discovery;
  an energy manager selects its behaviour by them.
covers: "Use-case discovery: every advertised use case states an actor and a version."
goal: "Proves the device's use-case discovery is complete."
category: Discovery
risk: read-only
spec: {document: "SPINE TS ProtocolSpecification 1.3.0 (use case discovery)", verification: wire}
requires:
  capabilities: [device_profile]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - assert:
      get: "/api/v1/peers/{peer.ski}/profile"
      length_greater_than: {use_case_details: 0}
      each_not_null: {use_case_details: [actor, version]}
