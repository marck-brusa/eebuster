name: opev-limit-roundtrip
description: >
  Writes a charging-current obligation on every phase the device declares (Overload
  Protection by EV Charging Current Curtailment, EEBus UC TS OPEV V1.0.1b, scenario 1) and
  requires it to be visible on readback, then releases it. Obligations cap the current the EV may draw per phase — the
  control a HEMS uses to protect a site fuse — so a device that accepts the write but keeps
  reporting the old limits leaves the energy manager blind to what is actually enforced.
  Needs a vehicle associated: some devices announce this use case permanently but only create
  the EV entity it lives on during a session, so without one the write fails (rather than
  skips) — which is itself worth knowing about a device.
covers: "OPEV scenario 1: a 6 A limit on every declared phase, then released."
goal: "Proves the device accepts a current limit and reports it back."
hint: "Needs a vehicle."
category: Conformance
risk: live-control
spec: {use_case: OPEV, scenario: 1, requirements: [OPEV-001, OPEV-003, OPEV-004], verification: readback}
requires:
  vehicle: true
  capabilities: [opev.write]
  use_cases: [overloadProtectionByEvChargingCurrentCurtailment]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  # The device evaluates writes only once the energy guard's heartbeat arrives.
  - call: {method: cem-opev/StartHeartbeat}
  - sleep: 2
  - put:
      path: "/api/v1/opev/{peer.ski}/limits"
      body:
        limits:
          - {phase: each, value_a: 6, is_active: true}
  - sleep: 2
  - assert:
      get: "/api/v1/opev/{peer.ski}"
      not_null: [limits]
      equals: {limits.0.value_a: 6, limits.0.is_active: true}
finally:
  - put:
      path: "/api/v1/opev/{peer.ski}/limits"
      body:
        limits:
          - {phase: each, value_a: 6, is_active: false}
