name: lpc-basic-limit
description: Applies a 4.2 kW consumption limit, observes the update, and verifies readback.
covers: "LPC scenario 1: a 4.2 kW consumption limit, written and read back."
goal: "Proves the device accepts a limit and reports it as active."
hint: "Changes the device's power while it runs."
category: LPC
risk: live-control
spec: {use_case: LPC, scenario: 1, test_case: ATC_COM_PT_CSConnection_007, requirements: [LPC-TS-001, LPC-TS-035], verification: readback}
requires:
  capabilities: [lpc.write, lpc.read]
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  # The device evaluates writes only once the energy guard's heartbeat arrives.
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      template: lpc.limit.dim_4200w_2h
  - expect_event: {event: eg-lpc-DataUpdateLimit, within: 5s}
  - assert:
      get: "/api/v1/lpc/{peer.ski}/limit"
      equals: {value_w: 4200, is_active: true}
