name: lpc-heartbeat-continuity
description: >
  Judges the latest five heartbeat notifications of the device on the trace; each must follow
  the previous one within 60 s, with 10 % allowed for transmission jitter. The test
  specification counts five heartbeats of the Controllable System and bounds the interval
  between two of them by 60 s. Heartbeats the device sent before the test case count, so a
  device connected for a few minutes is judged at once; otherwise the test case waits for the
  missing ones. Only notifications count: replies to the testbench's own heartbeat reads do
  not.
covers: "LPC scenario 3: five device heartbeats in a row, no gap longer than 60 s."
goal: "Proves the device keeps its heartbeat going, not only at connection time."
hint: "Instant when the device has been connected a few minutes; otherwise waits up to five minutes for its heartbeats."
category: LPC
risk: read-only
spec: {use_case: LPC, scenario: 3, test_case: ATC_COM_PT_CSHeartbeat_001, requirements: [LPC-TS-007], verification: wire, guidelines: {vde-fnn-steuerbox: [EEBUS_014, EEBUS_015, STB_0415]}}
requires:
  use_cases: [limitationOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  - device_heartbeats: {count: 5, max_gap: 66s, timeout: 330s}
