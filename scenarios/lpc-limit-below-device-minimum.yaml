name: lpc-limit-below-device-minimum
description: >
  While a vehicle charges, writes a consumption limit of 1 kW, below the power a charging device
  holds while it charges. LPC lets a device that does not apply a limit only reject it, for
  self-protection, safety or regulation; BK6-22-300 asks a device that cannot reduce its power to
  the value it is given for the next lower value it can. The power reported over MPC must come
  down within 60 s to 1 kW or to the lowest consumption the device holds while it charges: the
  device parameter minimum_power_w, 0 unless configured for the peer. measurement_tolerance_percent
  (5 % unless configured) is allowed above the larger of the two for the measurement.
covers: "LPC scenario 1: a limit below the device's minimum control power leads to the lowest value it can hold."
goal: "Proves a limit the device cannot meet exactly brings it down to the lowest consumption it can hold."
hint: "Needs a vehicle charging; set minimum_power_w for a device that holds a minimum consumption while it charges."
category: LPC
risk: disruptive
spec: {use_case: LPC, scenario: 1, requirements: [LPC-TS-035/3], verification: readback, guidelines: {bk6-22-300: ["4.6"]}}
requires:
  charging: true
  parameters: [minimum_power_w, measurement_tolerance_percent]
  capabilities: [lpc.write, mpc.read]
  use_cases: [limitationOfPowerConsumption, monitoringOfPowerConsumption]
peer: device-under-test
steps:
  - wait_connected: {timeout: 30s}
  # The device evaluates writes only once the energy guard's heartbeat arrives.
  - call: {method: eg-lpc/StartHeartbeat}
  - sleep: 2
  - skip_unless:
      get: "/api/v1/mpc/{peer.ski}"
      timeout: 30s
      greater_than: {power_w: 2000}
      reason: "the device draws 2 kW or less, so a 1 kW limit would show no reaction"
  # Without delete_duration the device keeps the duration it holds, possibly an expired one.
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      body: {value_w: 1000, is_active: true, is_changeable: true, delete_duration: true}
  - wait_for:
      get: "/api/v1/mpc/{peer.ski}"
      timeout: 60s
      less_or_equal_larger_of:
        power_w:
          bounds: [1000, "{params.minimum_power_w}"]
          tolerance_percent: "{params.measurement_tolerance_percent}"
finally:
  - put:
      path: "/api/v1/lpc/{peer.ski}/limit"
      template: lpc.limit.release
